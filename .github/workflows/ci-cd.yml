name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.6
          args: --timeout=5m

  test:
    name: Unit & Domain Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache: true

      - name: Run tests with race detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display coverage
        run: go tool cover -func=coverage.out

  build:
    name: Compile Binary
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache: true

      - name: Build server binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build \
            -ldflags="-s -w -X main.version=${{ github.sha }} -X main.commit=${{ github.sha }} -X main.buildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o bin/order-service ./cmd/server

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}

  deploy:
    name: Deploy & Healthcheck Verification
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy and run container
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          echo "Deploying image: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"
          docker run -d --name order-service-prod -p 8080:8080 "$IMAGE_TAG"

      - name: Wait for service readiness
        run: |
          echo "Waiting for service to be healthy..."
          for i in {1..15}; do
            if curl -s -f http://localhost:8080/healthz; then
              echo " Service is healthy!"
              break
            fi
            echo "Waiting ($i/15)..."
            sleep 2
          done

      - name: Verify API endpoints
        run: |
          echo "=== 1. Health Probe ==="
          curl -s http://localhost:8080/healthz | jq .
          
          echo "=== 2. Version Info ==="
          curl -s http://localhost:8080/version | jq .
          
          echo "=== 3. Create Sample Order ==="
          curl -s -X POST http://localhost:8080/api/v1/orders \
            -H "Content-Type: application/json" \
            -d '{"customer_id":"cust_test_01","items":[{"product_id":"item_1","title":"Go Book","quantity":2,"price":49.99}]}' | jq .
          
          echo "=== 4. Check Container Status ==="
          docker ps --filter "name=order-service-prod"

      - name: Cleanup deployment
        if: always()
        run: |
          docker stop order-service-prod || true
          docker rm order-service-prod || true
