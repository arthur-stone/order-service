run:
  timeout: 5m
  tests: true

linters-settings:
  govet:
    enable-all: false
    enable:
      - shadow
  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        disabled: false
      - name: package-comments
        disabled: true
  misspell:
    locale: US

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - ineffassign
    - misspell

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
